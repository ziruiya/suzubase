x-workspace: &workspace
  image: suzubase-dev:local
  pull_policy: never
  build: .

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: suzubase
      POSTGRES_PASSWORD: suzubase-dev
      POSTGRES_DB: suzubase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suzubase -d suzubase -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *workspace
    command: pnpm --filter @suzubase/db migrate
    environment:
      ADMIN_DATABASE_URL: postgres://suzubase:suzubase-dev@postgres:5432/suzubase
      MIGRATION_DATABASE_URL: postgres://suzubase_migration:suzubase-migration-dev@postgres:5432/suzubase
      RUNTIME_DATABASE_PASSWORD: suzubase-runtime-dev
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *workspace
    command: pnpm --filter @suzubase/api start
    environment:
      ATTACHMENT_DIRECTORY: /workspace/attachments
      SEARCH_TIMING: ${SEARCH_TIMING:-0}
      DATABASE_URL: postgres://suzubase_runtime:suzubase-runtime-dev@postgres:5432/suzubase
    volumes:
      - attachment-data:/workspace/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
  worker:
    <<: *workspace
    command: node apps/api/dist/worker.js
    environment:
      DATABASE_URL: postgres://suzubase_runtime:suzubase-runtime-dev@postgres:5432/suzubase
      ATTACHMENT_DIRECTORY: /workspace/attachments
      INDEX_DATABASE_URL: postgres://suzubase_migration:suzubase-migration-dev@postgres:5432/suzubase
      ATTACHMENT_RETENTION_HOURS: ${ATTACHMENT_RETENTION_HOURS:-720}
      ATTACHMENT_TEMPORARY_EXPIRY_HOURS: ${ATTACHMENT_TEMPORARY_EXPIRY_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-60}
    volumes:
      - attachment-data:/workspace/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    <<: *workspace
    command: pnpm --filter @suzubase/web exec vite preview --host 0.0.0.0 --port 5173
    environment:
      SUZUBASE_API_ORIGIN: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"

volumes:
  postgres-data:
  attachment-data:
