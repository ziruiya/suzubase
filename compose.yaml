x-workspace: &workspace
  image: suzubase-dev:local
  pull_policy: never
  build: .

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: suzubase
      POSTGRES_PASSWORD: suzubase-dev
      POSTGRES_DB: suzubase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suzubase -d suzubase -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    <<: *workspace
    command: pnpm --filter @suzubase/api start
    environment:
      DATABASE_URL: postgres://suzubase:suzubase-dev@postgres:5432/suzubase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
  web:
    <<: *workspace
    command: pnpm --filter @suzubase/web exec vite preview --host 0.0.0.0 --port 5173
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"

volumes:
  postgres-data:
