name: SuzuBase CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suzubase
          POSTGRES_PASSWORD: suzubase-ci
          POSTGRES_DB: suzubase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suzubase -d suzubase -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      ADMIN_DATABASE_URL: postgres://suzubase:suzubase-ci@127.0.0.1:5432/suzubase
      MIGRATION_DATABASE_URL: postgres://suzubase_migration:suzubase-migration-ci@127.0.0.1:5432/suzubase
      RUNTIME_DATABASE_PASSWORD: suzubase-runtime-ci
      DATABASE_URL: postgres://suzubase_runtime:suzubase-runtime-ci@127.0.0.1:5432/suzubase
      TEST_API_URL: http://127.0.0.1:3000
      TEST_WEB_URL: http://127.0.0.1:5173
      # Sample-site tests stub the Turnstile siteverify endpoint (the stub
      # itself is started by packages/db/test/sample-guest.test.cjs).
      TURNSTILE_SECRET_KEY: sample-test-secret
      TURNSTILE_SITEVERIFY_URL: http://127.0.0.1:18777/siteverify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/suzubase-tools" "$(node -p 'require("./package.json").packageManager')"
          echo "$RUNNER_TEMP/suzubase-tools/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 build
      - run: pnpm -r --workspace-concurrency=1 typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: Set integration system notification credential
        run: printf 'SUZUBASE_SYSTEM_NOTIFICATION_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrate and start API
        run: |
          pnpm --filter @suzubase/db migrate
          node apps/api/dist/main.js > "$RUNNER_TEMP/suzubase-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/suzubase-api.pid"
          curl --retry 12 --retry-all-errors --retry-delay 1 -fsS "$TEST_API_URL/health"
      - name: Integration tests
        run: pnpm test
      - name: Audit integrity (post-suite database)
        run: node tools/audit/audit-integrity.mjs --sample 20
      - name: Start web preview
        run: |
          pnpm --filter @suzubase/web exec vite preview --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/suzubase-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/suzubase-web.pid"
          curl --retry 12 --retry-all-errors --retry-delay 1 -fsS "$TEST_WEB_URL/api/health"
      - name: Browser tests
        run: pnpm test:browser
      - name: Stop background servers
        if: always()
        run: |
          for name in api web; do
            pid_file="$RUNNER_TEMP/suzubase-$name.pid"
            test ! -f "$pid_file" || kill "$(cat "$pid_file")" 2>/dev/null || true
          done
          pkill -f "vite preview" 2>/dev/null || true
      - name: Application logs
        if: failure()
        run: |
          for name in api web; do
            log="$RUNNER_TEMP/suzubase-$name.log"
            test ! -f "$log" || cat "$log"
          done
